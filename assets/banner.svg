<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitLight {
        0% { transform: rotate(0deg) translateX(140px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(140px) rotate(-360deg); }
      }
      .anim-glow1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 200px 180px; }
      .anim-glow2 { animation: pulseGlow 9s ease-in-out infinite 3s; transform-origin: 1000px 240px; }
      .anim-float1 { animation: floatSlow1 6s ease-in-out infinite; }
      .anim-float2 { animation: floatSlow2 7s ease-in-out infinite 1s; }
      .anim-dash { stroke-dasharray: 8 12; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Deep Night Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Tech Grid Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="350" y1="0" x2="350" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="180" r="160" fill="url(#glowCyan)" class="anim-glow1" />
  <circle cx="1020" cy="220" r="180" fill="url(#glowPurple)" class="anim-glow2" />

  <!-- Dynamic Flow Connector Curves (Behind text) -->
  <g fill="none" opacity="0.35">
    <path d="M 60,320 C 220,380 340,320 500,340 C 700,360 850,300 1140,340" stroke="#38bdf8" stroke-width="2" class="anim-dash" />
    <path d="M 80,100 C 260,60 400,120 620,80 C 820,50 960,110 1120,70" stroke="#c084fc" stroke-width="1.8" class="anim-dash" style="animation-direction: reverse;" />
  </g>

  <!-- Background Floating Version Manager Badges (Edges & Lower Third, away from center title) -->
  <!-- Left Side Badges -->
  <g class="anim-float1" opacity="0.85">
    <g transform="translate(60, 95)" filter="url(#cardShadow)">
      <rect width="115" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">nvm • node</text>
    </g>
    <g transform="translate(45, 230)" filter="url(#cardShadow)">
      <rect width="125" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#818cf8" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">pyenv • python</text>
    </g>
    <g transform="translate(90, 315)" filter="url(#cardShadow)">
      <rect width="115" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">fnm • rust</text>
    </g>
  </g>

  <!-- Right Side Badges -->
  <g class="anim-float2" opacity="0.85">
    <g transform="translate(1020, 90)" filter="url(#cardShadow)">
      <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#c084fc" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">asdf • polyglot</text>
    </g>
    <g transform="translate(1035, 215)" filter="url(#cardShadow)">
      <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#f43f5e" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">mise • fast-cli</text>
    </g>
    <g transform="translate(990, 310)" filter="url(#cardShadow)">
      <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">rustup • toolchain</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTENT (Unobscured, centered, high contrast) -->
  <g id="hero-content">
    <!-- Top Category Pill -->
    <g transform="translate(460, 48)" filter="url(#cardShadow)">
      <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="140" y="21" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title with Gradient -->
    <text x="600" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#titleGrad)">Awesome Version Managers</text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
      Language Runtimes • Multi-Tool Switching • Shims &amp; Per-Project Toolchains
    </text>

    <!-- Subtitle Line 2 (SEO & Description) -->
    <text x="600" y="235" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      A definitive directory of open-source CLI managers and cloud development environments
    </text>

    <!-- Center Language Ecosystem Pills Bar -->
    <g transform="translate(230, 275)" filter="url(#cardShadow)">
      <!-- Backdrop panel to guarantee foreground separation -->
      <rect width="740" height="48" rx="24" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />

      <!-- Language Badges inside Bar -->
      <g transform="translate(28, 12)">
        <text x="0" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⬢ Node.js</text>
        <text x="88" y="18" fill="#475569" font-size="13">•</text>
        <text x="108" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🐍 Python</text>
        <text x="186" y="18" fill="#475569" font-size="13">•</text>
        <text x="206" y="18" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">💎 Ruby</text>
        <text x="268" y="18" fill="#475569" font-size="13">•</text>
        <text x="288" y="18" fill="#fb923c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">☕ Java</text>
        <text x="348" y="18" fill="#475569" font-size="13">•</text>
        <text x="368" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🐹 Go</text>
        <text x="418" y="18" fill="#475569" font-size="13">•</text>
        <text x="438" y="18" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🦀 Rust</text>
        <text x="498" y="18" fill="#475569" font-size="13">•</text>
        <text x="518" y="18" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🌐 Polyglot (asdf / mise)</text>
      </g>
    </g>

    <!-- Bottom Tagline -->
    <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      MAINTAINED COMMUNITY RESOURCE • MIT LICENSED • CONTRIBUTIONS WELCOME
    </text>
  </g>
</svg>
